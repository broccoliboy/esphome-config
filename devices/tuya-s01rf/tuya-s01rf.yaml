substitutions:
  # default name is used as base for MAC suffix unique name generated by ESPHome
  name: "tuya-s01rf"
  friendly_name: "Wifi IR+RF Remote Control"
  comment: ""

esphome:
  project:
    name: broccoliboy.tuya-s01rf
    version: "1.0"

packages:
  hardware: !include ../../hardware/boards/cbu.yaml
  base: !include ../../common/base.yaml

logger:
  level: DEBUG
  baud_rate: 0

external_components:
  - source: ../../tuya_rf/components  # uncomment to use local components folder for development
  # - source: github://olivluca/tuya_rf
    refresh: 0s
    components: [ tuya_rf ]

#status led
status_led:
  pin: P9

#reset button, it has an external pull-down in my board
binary_sensor:
  - platform: gpio
    id: reset_button
    pin: P23

#rf transmitter and receiver
tuya_rf:
  id: rf
  receiver_disabled: true
  dump: raw

#for the ir leds
remote_transmitter:
  id: ir
  pin: P7
  carrier_duty_percent: 50%

#for the ir receiver
remote_receiver:
  pin:
   number: P8
   inverted: true
  dump: nec

switch:
  - platform: template
    name: "RF Receiver Enabled"
    id: rf_receiver_enabled
    optimistic: true
    entity_category: config
    turn_on_action:
      - tuya_rf.turn_on_receiver:
    turn_off_action:
      - tuya_rf.turn_off_receiver:
