# Thank you to bennydiamond for pin numbers and inspiration for this config :)
# https://github.com/bennydiamond/elegrp_spn10_esphome_template/blob/master/.base.elegrp.spn10_template.yaml

substitutions:
  # default name is used as base for MAC suffix unique name generated by ESPHome
  name: elegrp-spn10
  friendly_name: "ELEGRP SPN10 Switch"
  comment: ""
  log_level: DEBUG

esphome:
  project:
    name: "broccoliboy.elegrp-spn10"
    version: "1.0"

packages:
  hardware: !include ../../hardware/boards/cb2s.yaml
  base: !include ../../common/base.yaml

output:
  # White LED
  - platform: libretiny_pwm
    id: led_pwm_output
    pin:
      number: P24
      inverted: True
    frequency: 1000 Hz
    min_power: 0.01
    zero_means_zero: True
  # Relay output
  - platform: gpio
    id: relay_output
    pin:
      number: P7
      inverted: False

switch:
  - platform: template
    name: "Relay"
    id: relay_switch
    optimistic: true
    on_turn_on:
      - if:
          condition:
            switch.is_off: dummy
          then:
            - output.turn_on: relay_output
            - light.turn_off: status_led_light
      # else: do nothing if dummy is on
    on_turn_off:
      - if:
          condition:
            switch.is_off: dummy
          then:
            - output.turn_off: relay_output
            - light.turn_on: status_led_light
      # else: do nothing if dummy is on
  - platform: template
    name: "Dummy"
    id: dummy
    entity_category: "config"
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - output.turn_off: relay_output
      - light.turn_on: status_led_light
    on_turn_off:
      - if:
          condition:
            switch.is_on: relay_switch
          then:
            - output.turn_on: relay_output
            - light.turn_off: status_led_light
          else:
            - output.turn_off: relay_output
            - light.turn_on: status_led_light

binary_sensor:
  - platform: gpio
    id: button_up
    pin: 
      number: P6
      mode:
        input: True
        pullup: True
      inverted: True
    on_click:
      - min_length: 50ms
        max_length: 1s
        then:
          - switch.toggle: relay_switch
      - min_length: 10s
        max_length: 20s
        then:
          - button.press: factory_reset_button
  - platform: gpio
    id: button_down
    pin: 
      number: P23
      mode:
        input: True
        pullup: True
      inverted: True
    on_click:
      - then:
          - switch.toggle: relay_switch

light:
  - platform: status_led
    id: status_led_light
    output: led_pwm_output
    restore_mode: ALWAYS_ON
