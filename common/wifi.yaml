wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret wifi_ssid_fallback
      password: !secret wifi_password_fallback

sensor:
  - id: wifi_signal_sensor
    name: WiFi Signal
    platform: wifi_signal

text_sensor:
  - id: wifi_info_sensor
    platform: wifi_info
    ip_address:
      name: IP
    ssid:
      name: SSID
    bssid:
      name: BSSID
    mac_address:
      name: MAC
